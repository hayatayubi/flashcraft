<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff8fbf"/>
      <stop offset="0.55" stop-color="#d94c97"/>
      <stop offset="1" stop-color="#8a1b5e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.22" r="0.95">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe6f1"/>
    </linearGradient>
    <linearGradient id="card-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0f7"/>
      <stop offset="1" stop-color="#ffcfe4"/>
    </linearGradient>
    <linearGradient id="card-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd8e8"/>
      <stop offset="1" stop-color="#ffa9c8"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dx="0" dy="22" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.32"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#glow)"/>

  <g transform="translate(512 540)">
    <g transform="rotate(-16)" filter="url(#cardShadow)">
      <rect x="-260" y="-340" width="520" height="680" rx="56" ry="56" fill="url(#card-back)" opacity="0.92"/>
    </g>

    <g transform="translate(40 18) rotate(-4)" filter="url(#cardShadow)">
      <rect x="-260" y="-340" width="520" height="680" rx="56" ry="56" fill="url(#card-mid)"/>
    </g>

    <g transform="translate(-30 36) rotate(8)" filter="url(#cardShadow)">
      <rect x="-260" y="-340" width="520" height="680" rx="56" ry="56" fill="url(#card-front)"/>

      <rect x="-200" y="-260" width="120" height="22" rx="11" fill="#d94c97" opacity="0.55"/>

      <rect x="-200" y="-170" width="340" height="26" rx="13" fill="#8a1b5e" opacity="0.55"/>
      <rect x="-200" y="-122" width="280" height="26" rx="13" fill="#8a1b5e" opacity="0.45"/>
      <rect x="-200" y="-74" width="220" height="26" rx="13" fill="#8a1b5e" opacity="0.35"/>

      <rect x="-200" y="20" width="400" height="6" rx="3" fill="#d94c97" opacity="0.22"/>

      <rect x="-200" y="80" width="300" height="26" rx="13" fill="#8a1b5e" opacity="0.45"/>
      <rect x="-200" y="128" width="360" height="26" rx="13" fill="#8a1b5e" opacity="0.35"/>
      <rect x="-200" y="176" width="240" height="26" rx="13" fill="#8a1b5e" opacity="0.28"/>
    </g>
  </g>
</svg>
